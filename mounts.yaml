# 挂载到 www.waytoagi.com 路径下的静态页清单。
# 新增 / 更新页面：改这个文件提 PR。说明见 README.md。

host: www.waytoagi.com
zone_id: zone-3tbsf8e3cb9x            # waytoagi.com 的 EdgeOne 站点（L7 规则、清缓存）
origin: static-origin.waytoagi.com    # 独立 EdgeOne Pages 项目的自定义域名
pages_project: waytoagi-static-pages  # ProjectId makers-obe4szcie7gs

# 每个前缀在 www 上对应一条 L7 回源规则（scripts: python -m staticpages routes）。
# status:
#   pending  规则还没切到本源站：部署后只验证源站，不清 www 缓存，也不验证正式地址
#   active   规则已切：部署后清对应挂载的 www 缓存并验证正式地址
# Files that are too large for EdgeOne Pages (or listed in `always`) are uploaded to OSS under
# <prefix><sha256>.<ext> and their original path 302-redirects there. www serves <prefix>* from the
# bucket through one L7 rule (routes), so the redirect stays same-origin (no CORS, www certificate).
media:
  prefix: /_media/
  bucket: waytoagi-static-pages-media
  endpoint: oss-cn-hangzhou.aliyuncs.com
  region: cn-hangzhou
  min_bytes: 20000000        # EdgeOne Pages rejects files over 25MB
  always: ["*.mp4", "*.mov", "*.webm"]

namespaces:
  - prefix: /usecase-atlas/
    status: active     # 2026-09-27 cut over: rule-3vi6scsksy31
  - prefix: /community-growth-deck/
    status: active     # 2026-09-27 cut over: rule-3vi6zsyyc7tr
  - prefix: /kemengopc/
    status: active     # 2026-09-27 adopted in place: rule-3umlkdq1unp5; shared redirect retained.
  - prefix: /d20/
    status: active     # 2026-09-27 adopted in place: rule-3tbtnbo8njz2; shared entry redirects retained.

mounts:
  - path: /usecase-atlas/opus5-5/
    owner: noodles
    source:
      repo: waytoagi-team/gallery
      ref: 210cdba1c3f2c948d68f3216039cbac80f2a0e89
      dir: cases/models/claude-opus-5-5-usecases
    smoke:
      - expect: { selector: "#grid article.card", min: 24 }
      - fill: { selector: "#q", value: HAProxy }
        expect: { selector: "#grid article.card", min: 1 }

  - path: /community-growth-deck/
    owner: noodles
    source:
      repo: waytoagi-team/waytoagi-community-intro   # private: CI needs SOURCE_GITHUB_TOKEN
      ref: 669302ff1554a4b9b086c9ffceb160ddd1af5744
      dir: community-growth-deck
    exclude: [README.md]   # repo docs, not part of the deck
    smoke:
      - expect: { selector: "section", min: 34 }

  - path: /kemengopc/
    owner: noodles
    source:
      repo: waytoagi-team/waytoagi-community-intro
      ref: 26581469062802e89717a7b455584f58f962ad75
      dir: ""           # git archive <sha>: selects the repository root; "." does not.
    exclude:
      - community-growth-deck/
      - usecase-atlas/
      - scripts/
      - preview-contact-sheet.png
      - middleware.js  # Legacy-host redirect belongs only to the old Pages project.
    smoke:
      - expect: { selector: "#deck > section.slide", min: 28 }
      - expect: { selector: "#nav button.dot", min: 28 }

  - path: /d20/
    owner: noodles
    source:
      repo: waytoagi-team/d20
      ref: f6f2974368f33b672d2acbf477eea153733eeadb
      dir: ""
    exclude: [README.md, DEPLOYMENT.md, speaker-script.md]
    smoke:
      - expect: { selector: "#deck > section.slide", min: 32 }
      - expect: { selector: "video", min: 11 }
      - expect: { selector: "#prev", min: 1 }
      - expect: { selector: "#next", min: 1 }
