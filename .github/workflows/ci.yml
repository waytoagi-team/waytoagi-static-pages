name: ci

on:
  pull_request:
  # Bump PRs opened by the updates workflow (GITHUB_TOKEN) do not trigger pull_request; it dispatches ci instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m playwright install --with-deps chromium

      # Assemble dist/ from pinned sources, static checks, browser smoke test, diff against the live origin.
      - run: python -m staticpages plan --smoke
        env:
          ORIGIN_URL: ${{ vars.ORIGIN_URL }}
          # Read-only access to private source repos. Not available to PRs from forks.
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}

      - name: gitleaks (Pages and OSS candidates)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          python -m staticpages scan-secrets --gitleaks ./gitleaks

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
